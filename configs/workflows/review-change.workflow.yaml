version: 1
language: expr
workflows:
  - name: review-change
    description: Review a change and optionally schedule a repair activity.
    revision: 1
    entry: review
    max_parallelism: 1
    parameters_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        repair:
          type: boolean
      required: [repair]
      additionalProperties: false
    nodes:
      - id: review
        timeout: 2h
        script: |-
          let result = activity("review-agent", "manual", {task: "review"});
          if result.status == "ok" {
            "accepted"
          } else if parameters.repair {
            "repair"
          } else {
            "rejected"
          }
        routes:
          accepted: [done]
          repair: [repair]
          rejected: [failed]
        retry:
          max_attempts: 3
        resources:
          - key: workspace
            mode: exclusive
      - id: repair
        timeout: 4h
        script: |-
          let result = activity("repair-agent", "manual", {task: "repair"});
          if result.status == "ok" { "done" } else { "failed" }
        routes:
          done: [done]
          failed: [failed]
        retry:
          max_attempts: 3
        resources:
          - key: workspace
            mode: exclusive
      - id: done
        join: any
        terminal: succeeded
      - id: failed
        join: any
        terminal: failed
