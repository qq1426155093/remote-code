# remote-code-controller configuration, TOML schema version 7.
version = 7

# All file RPCs and relative process working directories are confined here.
workspace = "/srv/remote-code/workspace"

listen_address = "127.0.0.1:9443"
runtime_directory = "/var/run/remote-code-controller"
max_upload_bytes = 1073741824
max_processes = 16
allow_insecure_remote = false

[file_transfers]
resumable_enabled = true
upload_session_ttl = "24h"
completed_session_ttl = "1h"
max_active_upload_sessions = 64
max_staging_bytes = 4294967296
checkpoint_bytes = 4194304
checkpoint_interval = "1s"
max_concurrent_downloads = 16

[process_logs]
# Limits include encoded records and indexes. Oldest sealed segments are
# removed first when either size limit is reached.
max_bytes_per_process = 67108864
max_total_bytes = 4294967296
segment_bytes = 4194304
retention_after_exit = "168h"
max_observers_per_process = 8

[controller_logs]
# Controller lifecycle, process-service and MCP diagnostics are persisted as
# bounded JSON events and can be replayed with the controller-logs CLI command
# or ControllerService.ObserveControllerLogs.
max_bytes_per_controller = 33554432
max_total_bytes = 134217728
segment_bytes = 4194304
retention_after_restart = "168h"
max_observers = 8

# Uncomment both fields to enable TLS.
# [tls]
# certificate_file = "/etc/remote-code/tls/server.crt"
# key_file = "/etc/remote-code/tls/server.key"

# Store only the path in this file; keep the token in a mode-0600 file.
# [auth]
# token_file = "/etc/remote-code/controller.token"

# Process template definitions are trusted operator configuration. Copy the
# repository examples outside the workspace before enabling them.
[process_templates]
definition_files = []
# definition_files = [
#   "/etc/remote-code/process-templates/code-agents.process-template.yaml",
# ]

# Non-secret deployment constants available to Expr render expressions as
# extra_parameters.<key>. Keep credentials in separately protected files.
[process_templates.extra_parameters]
# default_model = "gpt-5"
# common_arguments = ["--approval-mode", "never"]
# environment = { HTTP_PROXY = "http://proxy.example" }

# MCP is disabled by default. Enabling it requires a bearer token and at least
# one definition file outside the workspace. It reuses the global TLS.
[mcp]
enabled = false
listen_address = "127.0.0.1:9444"
endpoint_path = "/mcp"

# Credential for the MCP listener. Without this key MCP reuses auth.token_file,
# which makes an MCP client's credential equivalent to full gRPC access. Set a
# separate token whenever MCP clients should not reach the gRPC surface.
# token_file = "/etc/remote-code/mcp.token"
definition_files = [
  "/etc/remote-code/mcp/controller.mcp.yaml",
  "/etc/remote-code/mcp/file.mcp.yaml",
  "/etc/remote-code/mcp/process.mcp.yaml",
]
allowed_origins = []
allowed_host_capabilities = [
  "controller.read",
  "files.read",
  "files.write",
  "processes.read",
  "processes.start",
  "processes.signal",
  "process_templates.read",
  "process_templates.start",
]
max_request_bytes = 1048576
max_response_bytes = 4194304
max_concurrent_calls = 16
requests_per_second = 20
request_burst = 40
default_tool_timeout = "30s"
max_tool_timeout = "5m"
tool_list_page_size = 100
