syntax = "proto3";

package remote.code.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/qq1426155093/remote-code/api/remote/code/v1;codev1";

service ControllerService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
}

service FileService {
  rpc Stat(StatRequest) returns (StatResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Tree(TreeRequest) returns (TreeResponse);
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  rpc Download(DownloadRequest) returns (stream DownloadResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc Chmod(ChmodRequest) returns (ChmodResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
}

service ProcessService {
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string controller_version = 1;
  string api_version = 2;
  string workspace_name = 3;
  int64 max_upload_bytes = 4;
  reserved 5;
  uint32 max_processes = 6;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_REGULAR = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_OTHER = 4;
}

message FileInfo {
  string path = 1;
  string name = 2;
  FileType type = 3;
  int64 size = 4;
  uint32 mode = 5;
  google.protobuf.Timestamp modified_at = 6;
  string symlink_target = 7;
}

message StatRequest {
  string path = 1;
}

message StatResponse {
  FileInfo file = 1;
}

message ListRequest {
  string path = 1;
}

message ListResponse {
  repeated FileInfo files = 1;
}

// TreeNode keeps the file hierarchy structured for non-CLI callers. Directory
// children are sorted by name; regular files and symbolic links are leaves.
message TreeNode {
  FileInfo file = 1;
  repeated TreeNode children = 2;
}

message TreeRequest {
  string path = 1;
}

message TreeResponse {
  TreeNode root = 1;
}

message UploadMetadata {
  string path = 1;
  int64 size = 2;
  bytes sha256 = 3;
  uint32 mode = 4;
  bool overwrite = 5;
}

message UploadRequest {
  oneof payload {
    UploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadResponse {
  FileInfo file = 1;
  int64 size = 2;
  bytes sha256 = 3;
}

message DownloadRequest {
  string path = 1;
}

message DownloadMetadata {
  FileInfo file = 1;
}

message DownloadSummary {
  int64 size = 1;
  bytes sha256 = 2;
}

message DownloadResponse {
  oneof payload {
    DownloadMetadata metadata = 1;
    bytes chunk = 2;
    DownloadSummary summary = 3;
  }
}

message RemoveRequest {
  string path = 1;
  bool recursive = 2;
}

message RemoveResponse {
  string path = 1;
}

message MoveRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}

message MoveResponse {
  FileInfo file = 1;
}

message ChmodRequest {
  string path = 1;
  uint32 mode = 2;
}

message ChmodResponse {
  FileInfo file = 1;
}

message MkdirRequest {
  string path = 1;
  uint32 mode = 2;
  bool parents = 3;
}

message MkdirResponse {
  FileInfo file = 1;
}

enum ProcessIOMode {
  PROCESS_IO_MODE_UNSPECIFIED = 0;
  PROCESS_IO_MODE_PIPE = 1;
  PROCESS_IO_MODE_PTY = 2;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STARTING = 1;
  PROCESS_STATE_RUNNING = 2;
  PROCESS_STATE_EXITED = 3;
  // The executable never started; the persistent audit record remains.
  PROCESS_STATE_FAILED = 4;
  // A previous controller stopped while the record was active.
  PROCESS_STATE_LOST = 5;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_HUP = 1;
  PROCESS_SIGNAL_INT = 2;
  PROCESS_SIGNAL_QUIT = 3;
  PROCESS_SIGNAL_TERM = 4;
  PROCESS_SIGNAL_KILL = 5;
  PROCESS_SIGNAL_USR1 = 6;
  PROCESS_SIGNAL_USR2 = 7;
  PROCESS_SIGNAL_STOP = 8;
  PROCESS_SIGNAL_CONT = 9;
}

message ProcessInfo {
  string id = 1;
  string name = 2;
  int64 pid = 3;
  ProcessIOMode io_mode = 4;
  ProcessState state = 5;
  string command = 6;
  repeated string arguments = 7;
  string working_directory = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp exited_at = 10;
  optional int32 exit_code = 11;
  // Native POSIX signal number when the process was terminated by a signal.
  optional int32 exit_signal = 12;
  google.protobuf.Timestamp created_at = 13;
  // Only names are exposed; environment values may contain secrets.
  repeated string environment_keys = 14;
}

message ProcessReference {
  oneof value {
    string id = 1;
    string name = 2;
    int64 pid = 3;
  }
}

message StartProcessRequest {
  string name = 1;
  // Concrete executable name or path. It is executed directly, without a shell.
  string command = 2;
  repeated string arguments = 3;
  string working_directory = 4;
  ProcessIOMode io_mode = 5;
  // Overrides applied after inheriting the controller environment.
  map<string, string> environment = 6;
}

message StartProcessResponse {
  ProcessInfo process = 1;
}

message ListProcessesRequest {
  // Include exited, failed and controller-lost persistent history.
  bool all = 1;
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message SignalProcessRequest {
  ProcessReference process = 1;
  ProcessSignal signal = 2;
  // Wait for the process leader to be reaped, bounded by the RPC context.
  bool wait = 3;
}

message SignalProcessResponse {
  ProcessInfo process = 1;
}
