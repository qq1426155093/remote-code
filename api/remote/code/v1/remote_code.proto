syntax = "proto3";

package remote.code.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/rpc/status.proto";

option go_package = "github.com/qq1426155093/remote-code/api/remote/code/v1;codev1";

service ControllerService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
}

service FileService {
  rpc Stat(StatRequest) returns (StatResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Tree(TreeRequest) returns (TreeResponse);
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  rpc Download(DownloadRequest) returns (stream DownloadResponse);
  rpc CreateUploadSession(CreateUploadSessionRequest) returns (CreateUploadSessionResponse);
  rpc TransferUpload(stream TransferUploadRequest) returns (stream TransferUploadResponse);
  rpc GetUploadSession(GetUploadSessionRequest) returns (GetUploadSessionResponse);
  rpc AbortUploadSession(AbortUploadSessionRequest) returns (AbortUploadSessionResponse);
  rpc DownloadRange(DownloadRangeRequest) returns (stream DownloadRangeResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc Chmod(ChmodRequest) returns (ChmodResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
}

service ProcessService {
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc ListProcessTemplates(ListProcessTemplatesRequest) returns (ListProcessTemplatesResponse);
  rpc GetProcessTemplate(GetProcessTemplateRequest) returns (GetProcessTemplateResponse);
  rpc StartProcessFromTemplate(StartProcessFromTemplateRequest) returns (StartProcessFromTemplateResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
  rpc DeleteProcess(DeleteProcessRequest) returns (DeleteProcessResponse);
  rpc BatchDeleteProcesses(BatchDeleteProcessesRequest) returns (BatchDeleteProcessesResponse);
  rpc ObserveProcessLogs(ObserveProcessLogsRequest) returns (stream ObserveProcessLogsResponse);
  rpc StreamProcessInput(stream StreamProcessInputRequest) returns (stream StreamProcessInputResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string controller_version = 1;
  string api_version = 2;
  string workspace_name = 3;
  int64 max_upload_bytes = 4;
  reserved 5;
  uint32 max_processes = 6;
  uint32 process_template_count = 7;
  FileTransferCapabilities file_transfers = 8;
}

message FileTransferCapabilities {
  bool resumable_upload = 1;
  bool resumable_download = 2;
  uint32 preferred_chunk_bytes = 3;
  uint32 max_chunk_bytes = 4;
  int64 upload_session_ttl_seconds = 5;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_REGULAR = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_OTHER = 4;
}

message FileInfo {
  string path = 1;
  string name = 2;
  FileType type = 3;
  int64 size = 4;
  uint32 mode = 5;
  google.protobuf.Timestamp modified_at = 6;
  string symlink_target = 7;
}

message StatRequest {
  string path = 1;
}

message StatResponse {
  FileInfo file = 1;
}

message ListRequest {
  string path = 1;
}

message ListResponse {
  repeated FileInfo files = 1;
}

// TreeNode keeps the file hierarchy structured for non-CLI callers. Directory
// children are sorted by name; regular files and symbolic links are leaves.
message TreeNode {
  FileInfo file = 1;
  repeated TreeNode children = 2;
}

message TreeRequest {
  string path = 1;
}

message TreeResponse {
  TreeNode root = 1;
}

message UploadMetadata {
  string path = 1;
  int64 size = 2;
  bytes sha256 = 3;
  uint32 mode = 4;
  bool overwrite = 5;
}

message UploadRequest {
  oneof payload {
    UploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadResponse {
  FileInfo file = 1;
  int64 size = 2;
  bytes sha256 = 3;
}

message DownloadRequest {
  string path = 1;
}

message DownloadMetadata {
  FileInfo file = 1;
}

message DownloadSummary {
  int64 size = 1;
  bytes sha256 = 2;
}

message DownloadResponse {
  oneof payload {
    DownloadMetadata metadata = 1;
    bytes chunk = 2;
    DownloadSummary summary = 3;
  }
}

enum UploadSessionState {
  UPLOAD_SESSION_STATE_UNSPECIFIED = 0;
  UPLOAD_SESSION_STATE_OPEN = 1;
  UPLOAD_SESSION_STATE_FINALIZING = 2;
  UPLOAD_SESSION_STATE_COMPLETE = 3;
  UPLOAD_SESSION_STATE_ABORTED = 4;
  UPLOAD_SESSION_STATE_EXPIRED = 5;
  UPLOAD_SESSION_STATE_FAILED = 6;
}

message CreateUploadSessionRequest {
  string request_id = 1;
  string path = 2;
  int64 size = 3;
  bytes sha256 = 4;
  uint32 mode = 5;
  bool overwrite = 6;
}

message UploadSession {
  string upload_id = 1;
  UploadSessionState state = 2;
  int64 committed_offset = 3;
  int64 size = 4;
  google.protobuf.Timestamp expires_at = 5;
  UploadResponse result = 6;
}

message CreateUploadSessionResponse {
  UploadSession session = 1;
}

message TransferUploadOpen {
  string upload_id = 1;
  int64 known_offset = 2;
}

message TransferUploadChunk {
  int64 offset = 1;
  bytes data = 2;
  bytes sha256 = 3;
}

message TransferUploadFinish {}

message TransferUploadRequest {
  oneof payload {
    TransferUploadOpen open = 1;
    TransferUploadChunk chunk = 2;
    TransferUploadFinish finish = 3;
  }
}

message TransferUploadReady {
  int64 committed_offset = 1;
}

message TransferUploadCheckpoint {
  int64 committed_offset = 1;
}

message TransferUploadComplete {
  UploadResponse result = 1;
}

message TransferUploadResponse {
  oneof payload {
    TransferUploadReady ready = 1;
    TransferUploadCheckpoint checkpoint = 2;
    TransferUploadComplete complete = 3;
  }
}

message GetUploadSessionRequest {
  string upload_id = 1;
}

message GetUploadSessionResponse {
  UploadSession session = 1;
}

message AbortUploadSessionRequest {
  string upload_id = 1;
}

message AbortUploadSessionResponse {
  UploadSession session = 1;
}

message DownloadRangeRequest {
  string path = 1;
  int64 offset = 2;
  bytes expected_revision = 3;
  bytes prefix_sha256 = 4;
}

message DownloadRangeMetadata {
  FileInfo file = 1;
  bytes revision = 2;
  int64 offset = 3;
}

message DownloadRangeChunk {
  int64 offset = 1;
  bytes data = 2;
  bytes sha256 = 3;
}

message DownloadRangeSummary {
  int64 size = 1;
  bytes sha256 = 2;
  bytes revision = 3;
}

message DownloadRangeResponse {
  oneof payload {
    DownloadRangeMetadata metadata = 1;
    DownloadRangeChunk chunk = 2;
    DownloadRangeSummary summary = 3;
  }
}

enum FileTransferErrorReason {
  FILE_TRANSFER_ERROR_REASON_UNSPECIFIED = 0;
  FILE_TRANSFER_ERROR_REASON_OFFSET_MISMATCH = 1;
  FILE_TRANSFER_ERROR_REASON_FILE_CHANGED = 2;
  FILE_TRANSFER_ERROR_REASON_PREFIX_MISMATCH = 3;
  FILE_TRANSFER_ERROR_REASON_SESSION_STATE = 4;
  FILE_TRANSFER_ERROR_REASON_ACTIVE_TRANSFER = 5;
}

message FileTransferError {
  FileTransferErrorReason reason = 1;
  int64 expected_offset = 2;
}

message RemoveRequest {
  string path = 1;
  bool recursive = 2;
}

message RemoveResponse {
  string path = 1;
}

message MoveRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}

message MoveResponse {
  FileInfo file = 1;
}

message ChmodRequest {
  string path = 1;
  uint32 mode = 2;
}

message ChmodResponse {
  FileInfo file = 1;
}

message MkdirRequest {
  string path = 1;
  uint32 mode = 2;
  bool parents = 3;
}

message MkdirResponse {
  FileInfo file = 1;
}

enum ProcessIOMode {
  PROCESS_IO_MODE_UNSPECIFIED = 0;
  PROCESS_IO_MODE_PIPE = 1;
  PROCESS_IO_MODE_PTY = 2;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STARTING = 1;
  PROCESS_STATE_RUNNING = 2;
  PROCESS_STATE_EXITED = 3;
  // The executable never started; the persistent audit record remains.
  PROCESS_STATE_FAILED = 4;
  // A previous controller stopped while the record was active.
  PROCESS_STATE_LOST = 5;
}

enum ProcessSignal {
  PROCESS_SIGNAL_UNSPECIFIED = 0;
  PROCESS_SIGNAL_HUP = 1;
  PROCESS_SIGNAL_INT = 2;
  PROCESS_SIGNAL_QUIT = 3;
  PROCESS_SIGNAL_TERM = 4;
  PROCESS_SIGNAL_KILL = 5;
  PROCESS_SIGNAL_USR1 = 6;
  PROCESS_SIGNAL_USR2 = 7;
  PROCESS_SIGNAL_STOP = 8;
  PROCESS_SIGNAL_CONT = 9;
}

enum ProcessLogStream {
  PROCESS_LOG_STREAM_UNSPECIFIED = 0;
  PROCESS_LOG_STREAM_STDOUT = 1;
  PROCESS_LOG_STREAM_STDERR = 2;
}

enum ProcessLogEndReason {
  PROCESS_LOG_END_REASON_UNSPECIFIED = 0;
  PROCESS_LOG_END_REASON_SNAPSHOT_COMPLETE = 1;
  PROCESS_LOG_END_REASON_PROCESS_EXITED = 2;
}

enum ProcessInputMode {
  PROCESS_INPUT_MODE_UNSPECIFIED = 0;
  // Preserve the historical behavior: PIPE receives EOF immediately and PTY
  // input cannot be written through the process API.
  PROCESS_INPUT_MODE_DISABLED = 1;
  // Keep the process input endpoint so clients can attach after it is running.
  PROCESS_INPUT_MODE_MANAGED = 2;
}

enum ProcessInputState {
  PROCESS_INPUT_STATE_UNSPECIFIED = 0;
  PROCESS_INPUT_STATE_UNAVAILABLE = 1;
  PROCESS_INPUT_STATE_OPEN = 2;
  PROCESS_INPUT_STATE_ATTACHED = 3;
  PROCESS_INPUT_STATE_CLOSED = 4;
}

enum ProcessInputEndReason {
  PROCESS_INPUT_END_REASON_UNSPECIFIED = 0;
  PROCESS_INPUT_END_REASON_DETACHED = 1;
  PROCESS_INPUT_END_REASON_INPUT_CLOSED = 2;
  PROCESS_INPUT_END_REASON_PROCESS_EXITED = 3;
}

message ProcessInfo {
  string id = 1;
  string name = 2;
  int64 pid = 3;
  ProcessIOMode io_mode = 4;
  ProcessState state = 5;
  string command = 6;
  repeated string arguments = 7;
  string working_directory = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp exited_at = 10;
  optional int32 exit_code = 11;
  // Native POSIX signal number when the process was terminated by a signal.
  optional int32 exit_signal = 12;
  google.protobuf.Timestamp created_at = 13;
  // Only names are exposed; environment values may contain secrets.
  repeated string environment_keys = 14;
  ProcessInputMode input_mode = 15;
  ProcessInputState input_state = 16;
  // Set for processes created through StartProcessFromTemplate.
  string template_name = 17;
  // SHA-256 revision of the immutable template used for this process.
  string template_revision = 18;
  // True when dynamic argv was deliberately omitted from ProcessInfo and
  // persistent metadata.
  bool arguments_redacted = 19;
}

message ProcessReference {
  oneof value {
    string id = 1;
    string name = 2;
    int64 pid = 3;
  }
}

message StartProcessRequest {
  string name = 1;
  // Concrete executable name or path. It is executed directly, without a shell.
  string command = 2;
  repeated string arguments = 3;
  string working_directory = 4;
  ProcessIOMode io_mode = 5;
  // Overrides applied after inheriting the controller environment.
  map<string, string> environment = 6;
  // MANAGED keeps stdin available for StreamProcessInput after startup.
  // Unspecified defaults to DISABLED for backward compatibility.
  ProcessInputMode input_mode = 7;
  // Optional initial PTY size. It is invalid for PIPE processes.
  TerminalSize terminal_size = 8;
}

message StartProcessResponse {
  ProcessInfo process = 1;
}

message ProcessTemplateSummary {
  string name = 1;
  string description = 2;
  string revision = 3;
  ProcessIOMode io_mode = 4;
  ProcessInputMode input_mode = 5;
}

message ProcessTemplate {
  ProcessTemplateSummary summary = 1;
  // JSON Schema Draft 2020-12 object accepted by this template.
  google.protobuf.Struct parameters_schema = 2;
}

message ListProcessTemplatesRequest {}

message ListProcessTemplatesResponse {
  repeated ProcessTemplateSummary templates = 1;
}

message GetProcessTemplateRequest {
  string name = 1;
}

message GetProcessTemplateResponse {
  ProcessTemplate template = 1;
}

message StartProcessFromTemplateRequest {
  string template_name = 1;
  // Unset is equivalent to an empty object.
  google.protobuf.Struct parameters = 2;
  string process_name = 3;
  // Optional initial size; valid only for a PTY template.
  TerminalSize terminal_size = 4;
  // When non-empty, the launch fails if the current template revision differs.
  string expected_template_revision = 5;
}

message StartProcessFromTemplateResponse {
  ProcessInfo process = 1;
}

message ListProcessesRequest {
  // Include exited, failed and controller-lost persistent history.
  bool all = 1;
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message SignalProcessRequest {
  ProcessReference process = 1;
  ProcessSignal signal = 2;
  // Wait for the process leader to be reaped, bounded by the RPC context.
  bool wait = 3;
}

message SignalProcessResponse {
  ProcessInfo process = 1;
}

message ObserveProcessLogsRequest {
  // Logs use the stable UUID only; names and PIDs can be reused.
  string process_id = 1;
  // Empty selects both streams. PTY output is exposed as stdout only.
  repeated ProcessLogStream streams = 2;
  oneof start {
    // Inclusive logical record offset. Zero is the first process log record.
    uint64 offset = 3;
    // Number of logical lines to replay across all selected streams.
    uint64 tail_lines = 4;
  }
  // Continue from the captured snapshot until process exit or cancellation.
  bool follow = 5;
}

message ProcessLogHeader {
  string process_id = 1;
  ProcessIOMode io_mode = 2;
  repeated ProcessLogStream streams = 3;
  uint64 earliest_offset = 4;
  uint64 snapshot_end_offset = 5;
  uint64 resolved_start_offset = 6;
  bool history_truncated = 7;
  bool tail_truncated = 8;
  bool follow = 9;
  uint32 format_version = 10;
}

message ProcessLogChunk {
  uint64 offset = 1;
  uint64 next_offset = 2;
  uint64 line_offset = 3;
  google.protobuf.Timestamp timestamp = 4;
  ProcessLogStream stream = 5;
  bytes data = 6;
  bool line_start = 7;
  bool line_end = 8;
  // The beginning of this logical line was removed by retention.
  bool line_truncated = 9;
}

message ProcessLogCheckpoint {
  uint64 next_offset = 1;
  bool replay_complete = 2;
}

message ProcessLogEnd {
  uint64 next_offset = 1;
  ProcessLogEndReason reason = 2;
  ProcessState state = 3;
  optional int32 exit_code = 4;
  optional int32 exit_signal = 5;
  bool logs_complete = 6;
}

message ObserveProcessLogsResponse {
  oneof payload {
    ProcessLogHeader header = 1;
    ProcessLogChunk chunk = 2;
    ProcessLogCheckpoint checkpoint = 3;
    ProcessLogEnd end = 4;
  }
}

message ProcessInputOpen {
  ProcessReference process = 1;
}

message ProcessInputData {
  // Starts at one and increases by one for every data or resize operation.
  uint64 sequence = 1;
  bytes data = 2;
}

message TerminalSize {
  uint32 rows = 1;
  uint32 columns = 2;
}

message ProcessTerminalResize {
  // Shares the ordered sequence space with ProcessInputData.
  uint64 sequence = 1;
  TerminalSize size = 2;
}

message ProcessInputClose {}

message ProcessInputDetach {}

message StreamProcessInputRequest {
  oneof payload {
    // Must be the first and only open frame.
    ProcessInputOpen open = 1;
    ProcessInputData data = 2;
    // PIPE only. PTY has no independent write-side close operation.
    ProcessInputClose close_input = 3;
    // Releases this stream without closing the remote input endpoint.
    ProcessInputDetach detach = 4;
    // Changes the size of an attached PTY.
    ProcessTerminalResize resize = 5;
  }
}

message ProcessInputOpened {
  ProcessInfo process = 1;
}

message ProcessInputAck {
  uint64 sequence = 1;
  uint32 bytes_written = 2;
}

message ProcessTerminalResizeAck {
  uint64 sequence = 1;
  TerminalSize size = 2;
}

message ProcessInputEnd {
  ProcessInputEndReason reason = 1;
  ProcessInfo process = 2;
}

message StreamProcessInputResponse {
  oneof payload {
    ProcessInputOpened opened = 1;
    ProcessInputAck ack = 2;
    ProcessInputEnd end = 3;
    ProcessTerminalResizeAck resize_ack = 4;
  }
}

message DeleteProcessRequest {
  ProcessReference process = 1;
}

message DeleteProcessResponse {
  // Snapshot of the terminal process whose persistent history was deleted.
  ProcessInfo process = 1;
}

message ProcessSelector {
  oneof value {
    ProcessReference reference = 1;
    // Case-sensitive path.Match-style glob applied only to logical process names.
    string name_glob = 2;
  }
}

message BatchDeleteProcessesRequest {
  repeated ProcessSelector selectors = 1;
}

message BatchDeleteSelectorResult {
  // Zero-based position in BatchDeleteProcessesRequest.selectors.
  uint32 selector_index = 1;
  uint32 matched_count = 2;
  // OK when the selector was valid and matched at least one process.
  google.rpc.Status status = 3;
}

message ProcessDeleteTarget {
  string id = 1;
  string name = 2;
  int64 pid = 3;
  ProcessState state = 4;
}

message BatchDeleteProcessResult {
  ProcessDeleteTarget process = 1;
  // Every input selector that matched this UUID, in request order.
  repeated uint32 selector_indexes = 2;
  // OK when the persistent history was deleted.
  google.rpc.Status status = 3;
}

message BatchDeleteProcessesResponse {
  // Exactly one result for each input selector.
  repeated BatchDeleteSelectorResult selectors = 1;
  // Exactly one result for each unique UUID selected by the request.
  repeated BatchDeleteProcessResult processes = 2;
}
